  .fc .face { position: absolute; inset: 0; border-radius: 18px; background: #fffafc; box-shadow: 0 18px 44px rgba(0,0,0,.3); backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 16px 18px; display: flex; flex-direction: column; justify-content: center; color: #3c1b30; }

  footer { padding: 0 0 60px; color: var(--muted); font-size: 14px; }

  .btns { display: flex; flex-direction: column; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; font-weight: 650; font-size: 15px; padding: 13px 18px; border-radius: 14px; border: 1px solid var(--line); color: var(--ink); background: var(--card); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .sc-media { min-width: 0; padding-top: 12px; }
  .stage { position: relative; }
  .track { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px 2px 14px; align-items: center; }

  .demo-cap { padding: 10px 16px 14px; font-size: 13px; color: var(--muted); }
  .pane-demo { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(135deg, #cfe0ff, #f3d9ff 55%, #ffe3d1); }
  @media (prefers-color-scheme: dark) { .pane-demo { background: linear-gradient(135deg, #1b2a52, #3a2655 55%, #51332b); } }
  .pane-menubar { position: absolute; top: 0; left: 0; right: 0; height: 6%; background: rgba(255,255,255,.35); }
  .pane-zone { position: absolute; border-radius: 10px; background: rgba(47,91,234,.22); border: 2px solid var(--accent); opacity: 0; transition: opacity .25s; top: 8%; bottom: 3%; }
  .pane-zone.on { opacity: 1; }
  .pw { position: absolute; border-radius: 10px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 0 0 1px var(--line); transition: left .55s cubic-bezier(.3,.7,.2,1), top .55s cubic-bezier(.3,.7,.2,1), width .55s cubic-bezier(.3,.7,.2,1), height .55s cubic-bezier(.3,.7,.2,1); overflow: hidden; }

  .pw .tb i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .5; }

  .pw.a .tb { background: #ffd9d4; } .pw.b .tb { background: #d4e6ff; } .pw.c .tb { background: #d8f5e4; }
  .pane-chip { position: absolute; right: 12px; bottom: 12px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; } .tile, .tile.w3 { grid-column: auto; min-height: 320px; }
    .sc-in { grid-template-columns: 1fr; gap: 20px; } .sc-side { position: static; }

</style>

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  APPS.forEach(function (a, i) {
    var b = document.createElement('button');
    b.className = 'tile' + (a.w3 ? ' w3' : ''); b.type = 'button';
    b.style.setProperty('--c1', a.c1); b.style.setProperty('--c2', a.c2);
    var cover = a.cover.mini ? '' : '<img class="shot ' + (a.cover.cls || '') + '" src="' + I(a.cover.src) + '" alt="" loading="lazy">';
    b.innerHTML = '<div class="cover">' + cover + '</div><div class="meta"><img src="' + I(a.icon) + '" alt=""><div><h3></h3><p></p></div><span class="arrow" aria-hidden="true">→</span></div>';
    b.querySelector('h3').textContent = a.name; b.querySelector('p').textContent = a.tag;
    b.setAttribute('aria-label', 'Open ' + a.name);
    b.addEventListener('click', function () { openApp(i); });
    if (a.cover.mini) buildMini(a.cover.mini, b.querySelector('.cover'));
    grid.appendChild(b);
  });

  /* ---- Tile covers ---- */
  function visibleFlag(el) { var o = { v: true }; if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { o.v = e[0].isIntersecting; }).observe(el); return o; }
  function buildMini(kind, cover) {
    var box = document.createElement('div'); box.className = 'mini ' + kind; cover.appendChild(box); var vis = visibleFlag(cover);
    function sl(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    if (kind === 'tidy') {
      var rows = [['Screenshot 2026-11-09 at 15.49.12.png', 'Receipt – Pret lunch £8.40.png'], ['Screen Shot 2026-11-08 at 21.07.44.png', 'Chat – Dinner plans with Sam.png'], ['Untitled 2.png', 'Error – Xcode build failed.png'], ['Screenshot 2026-11-08 at 09.12.30.png', 'Invoice – Amazon order 4821.png']];
      box.innerHTML = '<div class="m-card"><div class="bar"><i></i><i></i><i></i></div></div>';
      var card = box.firstChild, els = rows.map(function (r) { var d = document.createElement('div'); d.className = 'm-row'; d.innerHTML = '<span class="t"></span><span class="n"></span>'; d.querySelector('.n').textContent = r[0]; card.appendChild(d); return d; });
      if (reduce) { els.forEach(function (d, i) { d.className = 'm-row neat'; d.querySelector('.n').textContent = rows[i][1]; }); return; }
      (async function () { while (true) {
        els.forEach(function (d, i) { d.className = 'm-row'; d.querySelector('.n').textContent = rows[i][0]; }); await sl(1400);
        for (var i = 0; i < els.length; i++) { while (!vis.v) await sl(400); await sl(520); els[i].classList.add('swap'); await sl(220); els[i].querySelector('.n').textContent = rows[i][1]; els[i].className = 'm-row neat swap'; await sl(30); els[i].classList.remove('swap'); }
        await sl(2600); while (!vis.v) await sl(400);
      } })();
    } else if (kind === 'pane') {
      cover.removeChild(box); cover.appendChild(paneDemo().el);
    } else if (kind === 'flash') {
      var qa = [['What are the three elements of a valid contract?', 'Offer, acceptance and consideration.'], ['Which organelle produces most of the cell’s ATP?', 'The mitochondrion.'], ['How do you say “the bill, please”?', 'La cuenta, por favor.']];
      box.innerHTML = '<div class="fc-stage"><div class="fc-back two"></div><div class="fc-back"></div><div class="fc"><div class="face"><small>Question</small><b></b></div><div class="face ans"><small>Answer</small><b></b></div></div></div>';
      var fc = box.querySelector('.fc'), q = fc.querySelector('.face:not(.ans) b'), an = fc.querySelector('.ans b'), n = 0;
      function setQA() { q.textContent = qa[n][0]; an.textContent = qa[n][1]; } setQA();
      if (reduce) return;
      (async function () { while (true) { await sl(2300); while (!vis.v) await sl(400); fc.classList.add('flip'); await sl(2700); fc.classList.remove('flip'); await sl(500); n = (n + 1) % qa.length; setQA(); } })();
    } else if (kind === 'phones') {
      box.className = 'mini phones'; box.innerHTML = '<div class="pf l"><img src="' + I('focuslist-list.jpg') + '" alt="" loading="lazy"></div><div class="pf r"><img src="' + I('focuslist-new-task.jpg') + '" alt="" loading="lazy"></div>';
    } else if (kind === 'widget') {
      box.innerHTML = '<img class="wbg" src="' + I('calendarwidget-home.jpg') + '" alt="" loading="lazy"><img class="wfront" src="' + I('calendarwidget-widget.png') + '" alt="" loading="lazy">';
    }
  }

  /* ---- Demos ---- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function tidyDemo() {
    var rows = [["Screenshot 2026-11-09 at 15.49.12.png", "Receipt – Pret lunch £8.40.png"], ["Screenshot 2026-11-09 at 15.51.03.png", "Error – Xcode build failed.png"], ["Screen Shot 2026-11-08 at 21.07.44.png", "Chat – Dinner plans with Sam.png"], ["Screenshot 2026-11-08 at 09.12.30.png", "Invoice – Amazon order 4821.png"], ["Untitled 2.png", "Code – Swift ForEach example.png"]];
    var el = document.createElement('div'); el.className = 'demo-box';
    el.innerHTML = '<div class="demo-bar"><i></i><i></i><i></i><b>Screenshots</b><span class="demo-status">Waiting…</span></div><ul></ul><div class="demo-cap">TidyShot reads each new screenshot on your Mac and renames it, so your Desktop stops looking like this.</div>';
    var ul = el.querySelector('ul'), st = el.querySelector('.demo-status');
    var lis = rows.map(function (r) { var li = document.createElement('li'); li.className = 'messy'; li.innerHTML = '<span class="thumb"></span><span class="name"></span>'; li.querySelector('.name').textContent = r[0]; ul.appendChild(li); return li; });
    function neat(i) { lis[i].className = 'neat'; lis[i].querySelector('.name').textContent = rows[i][1]; }
    function messy(i) { lis[i].className = 'messy'; lis[i].querySelector('.name').textContent = rows[i][0]; }
    var alive = true;
    if (reduce) { rows.forEach(function (_, i) { neat(i); }); st.textContent = 'Renamed'; return { el: el, stop: function () {} }; }
    (async function () {
      while (alive) {
        rows.forEach(function (_, i) { messy(i); }); st.className = 'demo-status'; st.textContent = 'Waiting…'; await sleep(1500); if (!alive) return;
        st.className = 'demo-status on'; st.textContent = 'TidyShot is renaming…';
        for (var i = 0; i < rows.length && alive; i++) { await sleep(650); lis[i].classList.add('swap'); await sleep(250); lis[i].querySelector('.name').textContent = rows[i][1]; lis[i].className = 'neat swap'; await sleep(30); lis[i].classList.remove('swap'); }
        st.textContent = 'All renamed'; await sleep(3200);
      }
    })();
    return { el: el, stop: function () { alive = false; } };
  }
  function paneDemo() {
    var el = document.createElement('div'); el.className = 'pane-demo';
    el.innerHTML = '<div class="pane-menubar"></div><div class="pane-zone"></div>' + ['a', 'b', 'c'].map(function (k) { return '<div class="pw ' + k + '"><div class="tb"><i></i><i></i><i></i></div><div class="ln"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:75%"></div></div>'; }).join('') + '<div class="pane-chip">Drag to an edge</div>';
    var W = el.querySelectorAll('.pw'), Z = el.querySelector('.pane-zone'), chip = el.querySelector('.pane-chip');
    function put(e, l, t, w, h, z) { e.style.left = l + '%'; e.style.top = t + '%'; e.style.width = w + '%'; e.style.height = h + '%'; if (z) e.style.zIndex = z; }
    function zone(l, w) { Z.style.left = l + '%'; Z.style.width = w + '%'; Z.classList.add('on'); }
    function messy() { put(W[0], 8, 14, 46, 52, 1); put(W[1], 30, 28, 44, 50, 2); put(W[2], 48, 12, 40, 56, 3); }
    var alive = true; messy();
    if (reduce) { put(W[0], 1, 8, 32, 89); put(W[1], 34, 8, 32, 89); put(W[2], 67, 8, 32, 89); chip.textContent = 'Thirds'; return { el: el, stop: function () {} }; }
    (async function () {
      await sleep(300);
      while (alive) {
        messy(); Z.classList.remove('on'); chip.textContent = 'Drag to an edge'; await sleep(1600); if (!alive) return;
        zone(0, 50); chip.textContent = 'Left half'; await sleep(700); put(W[0], 1, 8, 48.5, 89); Z.classList.remove('on'); await sleep(900);
        zone(50, 50); chip.textContent = 'Right half'; await sleep(700); put(W[1], 50.5, 8, 48.5, 89); Z.classList.remove('on'); await sleep(900);
        chip.textContent = 'Hotkey: thirds'; await sleep(700); put(W[0], 1, 8, 32, 89); put(W[1], 34, 8, 32, 89); put(W[2], 67, 8, 32, 89, 4); await sleep(2800);
      }
    })();
    return { el: el, stop: function () { alive = false; } };
  }

  /* ---- Showcase ---- */
  function openApp(i, noHash) {
    var a = APPS[i]; current = i; stopDemos();
    sc.style.setProperty('--c1', a.c1);
    scin.innerHTML = '';
    var top = document.createElement('div'); top.className = 'sc-top';
    top.innerHTML = '<button class="sc-btn" id="back" type="button">← All apps</button><div class="sc-nav"><button class="sc-btn" id="prev" type="button" aria-label="Previous app">←</button><button class="sc-btn" id="next" type="button" aria-label="Next app">→</button></div>';
    var side = document.createElement('div'); side.className = 'sc-side';
    side.innerHTML = '<img class="icon" src="' + I(a.icon) + '" alt=""><h2></h2><div class="chips"></div><p class="desc"></p><div class="btns"></div>';
    side.querySelector('h2').textContent = a.name; side.querySelector('.desc').textContent = a.desc;
    a.chips.forEach(function (c) { var s = document.createElement('span'); s.className = 'chip'; s.textContent = c; side.querySelector('.chips').appendChild(s); });
    a.btns.forEach(function (b) { var e = document.createElement(b[1] ? 'a' : 'span'); e.className = 'btn' + (b[2] ? ' primary' : '') + (b[1] ? '' : ' soon'); e.textContent = b[0]; if (b[1]) { e.href = b[1]; e.target = '_blank'; e.rel = 'noopener'; } side.querySelector('.btns').appendChild(e); });
    var media = document.createElement('div'); media.className = 'sc-media';
    a.media.forEach(function (m) {
      if (m.g) { var gl = document.createElement('div'); gl.className = 'group-label'; gl.textContent = m.g; media.appendChild(gl); }
      var stage = document.createElement('div'); stage.className = 'stage';
      var track = document.createElement('div'); track.className = 'track'; stage.appendChild(track);
      if (m.demo) {
        var d = m.demo === 'tidy' ? tidyDemo() : paneDemo(); cleanup.push(d.stop);
        var sl = document.createElement('div'); sl.className = 'slide demo'; sl.appendChild(d.el); track.appendChild(sl);
      } else {
        m.s.forEach(function (f) { var sl = document.createElement('div'); sl.className = 'slide ' + m.k; var im = new Image(); im.src = I(f); im.alt = a.name + ' screenshot'; im.decoding = 'async'; sl.appendChild(im); track.appendChild(sl); });
        if (m.s.length > 1) {
          var ctrl = document.createElement('div'); ctrl.className = 'ctrl';
          ctrl.innerHTML = '<span class="count">1 / ' + m.s.length + '</span><button class="cbtn" type="button" aria-label="Previous screenshot">‹</button><button class="cbtn" type="button" aria-label="Next screenshot">›</button>';
          var cnt = ctrl.querySelector('.count'), bs = ctrl.querySelectorAll('.cbtn');
          (function (track, cnt, bs, n) {
            function idx() { var kids = track.children, c = track.scrollLeft + track.clientWidth / 2, best = 0, bd = 1e9; for (var k = 0; k < kids.length; k++) { var mid = kids[k].offsetLeft - track.offsetLeft + kids[k].offsetWidth / 2, dd = Math.abs(mid - c); if (dd < bd) { bd = dd; best = k; } } return best; }
            function upd() { var k = idx(); cnt.textContent = (k + 1) + ' / ' + n; bs[0].disabled = k === 0; bs[1].disabled = k === n - 1; }
            function go(d) { var k = Math.max(0, Math.min(n - 1, idx() + d)), el = track.children[k]; track.scrollTo({ left: el.offsetLeft - track.offsetLeft - (track.clientWidth - el.offsetWidth) / 2, behavior: 'smooth' }); }
            bs[0].onclick = function () { go(-1); }; bs[1].onclick = function () { go(1); };
            track.addEventListener('scroll', function () { requestAnimationFrame(upd); }); setTimeout(upd, 60);
            track._go = go;
          })(track, cnt, bs, m.s.length);
          stage.appendChild(ctrl);
        }
      }
      media.appendChild(stage);
    });
    scin.appendChild(top); scin.appendChild(side); scin.appendChild(media);
    document.getElementById('back').onclick = closeApp;
    document.getElementById('prev').onclick = function () { openApp((current + APPS.length - 1) % APPS.length); };
    document.getElementById('next').onclick = function () { openApp((current + 1) % APPS.length); };
    sc.hidden = false; sc.classList.add('open'); document.body.classList.add('locked'); sc.scrollTop = 0;
    if (!noHash) history.replaceState(null, '', '#' + a.id);
    document.title = a.name + ' · Hayat Ayubi Portfolio';
    document.getElementById('back').focus({ preventScroll: true });
  }
  function stopDemos() { cleanup.forEach(function (f) { f(); }); cleanup = []; }
  function closeApp() {
    stopDemos(); sc.classList.remove('open'); sc.hidden = true; document.body.classList.remove('locked');
    history.replaceState(null, '', location.pathname + location.search); document.title = 'Hayat Ayubi Portfolio';
    var t = grid.children[current]; current = -1; if (t) t.focus({ preventScroll: true });
  }
  document.addEventListener('keydown', function (e) {
    if (current < 0) return;
    if (e.key === 'Escape') closeApp();
    else if (e.key === 'ArrowRight' && e.shiftKey) document.getElementById('next').click();
    else if (e.key === 'ArrowLeft' && e.shiftKey) document.getElementById('prev').click();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var tr = scin.querySelector('.track'); if (tr && tr._go) { tr._go(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault(); } }
  });
  function fromHash() { var id = location.hash.replace('#', ''), i = APPS.findIndex(function (a) { return a.id === id; }); if (i >= 0) openApp(i, true); else if (current >= 0) closeApp(); }
  window.addEventListener('hashchange', fromHash); fromHash();
})();
</script>
